[project]
name = "cortexsearch"
version = "1.0.0"
description = "Enterprise-grade Retrieval-Augmented Generation (RAG) system for intelligent document search with citations, hybrid retrieval, and LLM-powered answers."
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.135.2",
    "ollama>=0.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pymupdf>=1.27.2.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.22",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.42.0",
]
